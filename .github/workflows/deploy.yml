name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Partial clone: full commit+tree history (needed by `git log --since`
          # and `git diff <base>..HEAD`), but no blob content. Historical media
          # is never downloaded — only the current files' blobs (fetched lazily
          # at checkout). The recent-updates card reads only file names/status
          # (see `--no-renames` in shared/git.ts) plus one tiny collections.yml,
          # so it works without pulling media history. Keeps clone size ~constant
          # regardless of how much media churn the repo accumulates.
          fetch-depth: 0
          filter: blob:none

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Cache template node_modules
        uses: actions/cache@v4
        with:
          path: packages/template-astro/node_modules
          key: tmpl-${{ runner.os }}-${{ hashFiles('packages/template-astro/package-lock.json') }}

      - name: Cache gen node_modules
        uses: actions/cache@v4
        with:
          path: packages/gen/node_modules
          key: gen-${{ runner.os }}-${{ hashFiles('packages/gen/package-lock.json') }}

      - name: Cache image compression outputs
        uses: actions/cache@v4
        with:
          # Persistent webp/avif variants + content-hash index, decoupled from
          # node_modules so lockfile churn never forces a full re-encode.
          path: packages/template-astro/node_modules/.cache/chronicle-images
          key: imgcache-${{ runner.os }}-v1

      - name: Install template dependencies
        run: npm install
        working-directory: packages/template-astro

      - name: Install gen dependencies
        run: npm install
        working-directory: packages/gen

      - name: Build
        run: |
          node packages/gen/bin/cli.mjs build \
            --dataDir data \
            --codeDir packages/template-astro \
            --targetDir dist

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
