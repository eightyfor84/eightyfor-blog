# Chronicle Aurora site configuration — written by the CMS settings pages; hand-written comments and untouched keys are preserved

# ── 主板基础（非插件）──

# Homepage settings (Template settings → Homepage)
homepage:
  siteName: Blogs →
  siteDescription: 爱我所爱，自成一派。 Love what you wanna love, be what you wanna be.
  icpNumber: '京ICP备2025153813号-1'
  homepageMode: split
  singleColumnHomepage: false
  cardVisibility:
    activity: true
    taxonomy: true
    author: true
  recentUpdates:
    aggregateDays: 3
    staleDays: 30

# Appearance settings (Template settings → Appearance: theme/accent/font/locale)
appearance:
  theme: follow
  accent: '#51a32e'
  font: sans
  locale: follow
  defaultPerformanceMode: auto

rss: true

# Analytics (multi-backend)
analytics:
  enabled: false
  backend: ''
  gaMeasurementId: ''
  cloudflareToken: ''
  umamiServerUrl: ''
  umamiWebsiteId: ''
  plausibleServerUrl: ''
  plausibleDomain: ''
  baiduId: ''

# 文章页基础（主板预设）：头部信息 meta
post:
  meta: { metaUpdated: true, metaStats: true, metaAiBadge: true, showTags: true }

# ── 插件分组（每插件一段：开关 + 配置；开关键 = 该插件 featureFlag 名）──
search:
  enabled: true
  searchSuggestions: true
  globalSearch: true
  fullTextSearch: true
comments:
  enabled: true
  comments: true
  backend: 'waline'
  walineServerUrl: "https://aurora-comments.eightyfor.top"
  attitude: true
  showGeoAddress: true
  imageUploadEnabled: false
  imageUploadEndpoint: ""
  imageUploadToken: ""
reading-experience:
  enabled: true
  readingExperience: true
  toc:
    enabled: true
    inlineToc: true
    tocFloat: true
    tocFloatAlwaysExpanded: false
    mobileTocControl: true
  endOfArticle:
    share: true
    shareChannels:
      - twitter
      - linkedin
      - weibo
    prevNextMode: both
    prevNextScope: collection
    prevNext: true
    relatedPosts: true
    authorCard: false
    prevNextOrder: desc
friends:
  enabled: true
collections:
  enabled: true
slides:
  enabled: false
